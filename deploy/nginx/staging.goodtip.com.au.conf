# staging.goodtip.com.au
#
# Installed by deploy/bootstrap-staging.sh into /etc/nginx/sites-available and
# symlinked into sites-enabled. Deliberately HTTP-only as written: certbot
# --nginx rewrites this file in place to add the :443 server block, the
# certificate paths and the http->https redirect. Committing the post-certbot
# version instead would mean shipping a config that refuses to start until a
# certificate that does not exist yet is issued.
#
# Production's vhost is not in this repo -- it predates deploy/ and is managed
# by hand on the box. Nothing here touches it: nginx routes on server_name, and
# this file names only the staging host.

server {
    listen 80;
    listen [::]:80;
    server_name staging.goodtip.com.au;

    # Avatar uploads. Matches what production allows; the default 1m rejects a
    # photo straight off a phone with a 413 and no useful message.
    client_max_body_size 10M;

    # Staging is behind the branded gate (STAGING_GATE=true), so a crawler
    # sees only the lock page -- but the gate is a setting someone can turn
    # off, and the cost of it being off for an afternoon is staging.goodtip
    # ranking against goodtip.com.au for the client's own brand terms. This
    # header does not depend on the gate and applies to every response,
    # including ones the gate exempts.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Media is user-uploaded files on disk; whitenoise serves /static/ from
    # inside the app but has nothing to do with MEDIA_ROOT.
    location /media/ {
        alias /home/mbatha-goodtip/projects/goodtip-staging/media/;
        expires 7d;
        access_log off;
    }

    location / {
        # 8001, not 8000: production's gunicorn owns 8000 on this box.
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this Django builds http:// URLs behind the TLS terminator,
        # request.is_secure() is False, and the gate cookie never gets its
        # Secure flag (see staging_gate.gate_view).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
