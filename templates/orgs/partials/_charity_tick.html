<label class="chx-tick"><input type="checkbox" name="charities" value="{{ ch.pk }}"{% if request.GET.with == ch.pk|stringformat:"s" or org.charity_id == ch.pk %} checked{% endif %}><span class="chx-box"><span class="gb-av">{% if ch.logo %}<img src="{{ ch.logo.url }}" alt="" loading="lazy">{% else %}{{ ch.initials }}{% endif %}</span><b>{{ ch.name }}</b>{% if ch.owner_org_id == org.id %}<small>Added by you</small>{% elif org.charity_id == ch.pk %}<small>Backing now</small>{% endif %}</span></label>
